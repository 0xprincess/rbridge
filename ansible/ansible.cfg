[defaults]
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
roles_path = roles
display_args_to_stdout = False

[ssh_connection]
ssh_args = -o ForwardAgent=no -o ProxyCommand=none -o ProxyJump=none -o StrictHostKeyChecking=yes
# Reloading the relay's sshd re-executes it; a new connection during that gap
# (including the reload task's own cleanup) is refused and must be retried.
retries = 3
