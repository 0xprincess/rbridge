# Copy outside the checkout and replace the documentation-only values.
all:
  vars:
    frp_server_address: relay.<relay-ip>.rbr.sh
    frp_relay_ssh_port: 22
    frp_managed_ssh: true
    frp_services:
      - name: ssh
        protocol: tcp
        backend: 127.0.0.1:2222
        relay_port: 12222
        public_port: 2222
      - name: app
        protocol: http
        backend: http://127.0.0.1:8080
        relay_port: 18080
        hostname: app.<relay-ip>.rbr.sh  # or your own domain, e.g. app.example.com
        access:
          mode: application
    frp_backend_ssh_port: 2222
    frp_login_user: developer
  children:
    frp_servers:
      hosts:
        relay:
          ansible_host: relay.<relay-ip>.rbr.sh
          ansible_user: root
    frp_clients:
      hosts:
        origin:
          ansible_connection: local
          ansible_host: localhost
