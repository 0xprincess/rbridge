---
- name: Create the isolated application configuration directory
  ansible.builtin.file:
    path: "/etc/frp-tunnel/web/oidc-{{ app.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the application's explicit email allowlist
  ansible.builtin.copy:
    content: "{{ (app.access.allowed_emails | default([]) | join('\n')) + '\n' }}"
    dest: "/etc/frp-tunnel/web/oidc-{{ app.name }}/emails"
    owner: root
    group: root
    mode: "0644"
  register: frp_web_oidc_emails
  no_log: true
  diff: false

- name: Validate authenticator configuration before replacing secrets
  ansible.builtin.template:
    src: oauth2-proxy.cfg.j2
    dest: "/etc/frp-tunnel/web/oidc-{{ app.name }}/oauth2.cfg"
    owner: root
    group: root
    mode: "0600"
    validate: "{{ frp_web_oauth2_binary }} --config=%s --config-test"
  register: frp_web_oidc_config
  no_log: true
  diff: false

- name: Install the isolated authenticator unit
  ansible.builtin.template:
    src: frp-tunnel-oidc.service.j2
    dest: "/etc/systemd/system/frp-tunnel-oidc-{{ app.name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: frp_web_oidc_unit

- name: Record authenticators that require restart
  ansible.builtin.set_fact:
    frp_web_oidc_changed: "{{ frp_web_oidc_changed + [app.name] }}"
  when: frp_web_oidc_config.changed or frp_web_oidc_emails.changed or frp_web_oidc_unit.changed
  no_log: true
