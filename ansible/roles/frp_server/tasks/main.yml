---
- name: Create the forwarding-only relay account
  ansible.builtin.user:
    name: "{{ frp_relay_user }}"
    system: true
    create_home: true
    home: "/var/lib/rbridge-relay"
    shell: /usr/sbin/nologin
    password_lock: true

- name: Restrict the relay home directory
  ansible.builtin.file:
    path: /var/lib/rbridge-relay
    state: directory
    owner: "{{ frp_relay_user }}"
    group: "{{ frp_relay_user }}"
    mode: "0700"

- name: Create the relay SSH directory
  ansible.builtin.file:
    path: /var/lib/rbridge-relay/.ssh
    state: directory
    owner: "{{ frp_relay_user }}"
    group: "{{ frp_relay_user }}"
    mode: "0700"

- name: Install only the restricted forwarding key for the relay account
  ansible.builtin.copy:
    content: 'restrict,port-forwarding,permitopen="127.0.0.1:{{ frp_server_port | int }}" {{ frp_relay_public_key | trim }}{{ "\n" }}'
    dest: /var/lib/rbridge-relay/.ssh/authorized_keys
    owner: "{{ frp_relay_user }}"
    group: "{{ frp_relay_user }}"
    mode: "0600"
  no_log: true
  diff: false

- name: Apply SELinux labels to the relay account keys
  ansible.builtin.command:
    argv: [restorecon, -R, -v, /var/lib/rbridge-relay]
  register: frp_selinux_relay_labels
  changed_when: frp_selinux_relay_labels.stdout | length > 0
  when: frp_selinux

# Some distributions ship sshd_config with the drop-in Include but no directory.
- name: Create the system SSH drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Restrict SSH forwarding for the project relay account
  ansible.builtin.template:
    src: sshd-relay.conf.j2
    dest: /etc/ssh/sshd_config.d/00-rbridge.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  no_log: true
  diff: false
  notify: Reload relay SSH policy

- name: Validate the complete relay SSH configuration
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -t]
  changed_when: false
  no_log: true

- name: Inspect effective forwarding account policy
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
      - -C
      - "user={{ frp_relay_user }},host=localhost,addr=127.0.0.1"
  register: frp_relay_effective_policy
  changed_when: false
  no_log: true

- name: Require the account-specific SSH restrictions to be effective
  ansible.builtin.assert:
    that:
      - "'allowtcpforwarding local' in frp_relay_policy_lines"
      - "'allowstreamlocalforwarding no' in frp_relay_policy_lines"
      - "'authenticationmethods publickey' in frp_relay_policy_lines"
    fail_msg: >-
      The relay account restrictions are not effective. The system sshd_config
      must contain "Include /etc/ssh/sshd_config.d/*.conf" before any Match block.
  no_log: true
  vars:
    # OpenSSH 10 prints sshd -T keywords in mixed case; older releases lowercase.
    frp_relay_policy_lines: "{{ frp_relay_effective_policy.stdout_lines | map('lower') | list }}"

- name: Prepare public listeners and remove stale listeners before changing FRP
  ansible.builtin.include_tasks: publish.yml

- name: Install the loopback-only FRP server configuration
  ansible.builtin.template:
    src: frps.toml.j2
    dest: /etc/rbridge/frps.toml
    owner: root
    group: "{{ frp_service_user }}"
    mode: "0640"
    validate: "{{ frp_binary_dir }}/frps verify -c %s"
  notify: Restart FRP server
  no_log: true
  diff: false

- name: Install the FRP server service
  ansible.builtin.template:
    src: rbridge-server.service.j2
    dest: /etc/systemd/system/rbridge-server.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart FRP server

- name: Apply pending server changes
  ansible.builtin.meta: flush_handlers

- name: Enable the FRP server at boot
  ansible.builtin.systemd_service:
    name: rbridge-server
    enabled: true
    state: started
    daemon_reload: true

