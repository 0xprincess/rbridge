---
frp_version: "0.71.0"
frp_checksums:
  "0.71.0":
    amd64: "84f27e39f11169f7adcef8e8b70c9329de17747b1f14dad9fb95eef5682ea716"
    arm64: "f33c293c275d8fc68c654b6fba8f10b2551d6463d09a9fc9cffb7227eae82266"
frp_architectures:
  x86_64: amd64
  aarch64: arm64
# Supported systemd distribution families (ansible_facts.os_family). Commands
# query/install only distribution packages; Debian uses the apt module.
# selinux_packages are added only on hosts with SELinux enabled.
frp_platforms:
  Debian:
    packages: [ca-certificates, openssh-client, openssh-server, python3-yaml, tar, util-linux]
    ssh_service: ssh.service
    selinux_packages: [policycoreutils-python-utils]
  RedHat:
    packages: [ca-certificates, openssh-clients, openssh-server, python3-pyyaml, tar, util-linux]
    query: [rpm, -q, --whatprovides]
    install: [dnf, -y, install]
    ssh_service: sshd.service
    selinux_packages: [policycoreutils-python-utils]
  Suse:
    packages: [ca-certificates, openssh-clients, openssh-server, python3-PyYAML, tar, util-linux]
    query: [rpm, -q, --whatprovides]
    install: [zypper, --non-interactive, install, --no-recommends]
    ssh_service: sshd.service
    selinux_packages: [policycoreutils-python-utils]
  Archlinux:
    # Arch does not support partial upgrades: the administrator keeps the host
    # synchronized (pacman -Syu); the role never refreshes package databases.
    packages: [ca-certificates, openssh, python-yaml, tar, util-linux]
    query: [pacman, -T]
    install: [pacman, -S, --needed, --noconfirm]
    ssh_service: sshd.service
# LoadCredential= and %d (systemd 247) are the newest unit features in use.
frp_minimum_systemd: 247
frp_service_user: rbridge
frp_relay_user: frp-relay
frp_server_port: 7000
frp_forward_port: 17001
frp_managed_ssh: true
frp_services:
  - name: ssh
    protocol: tcp
    backend: "127.0.0.1:{{ frp_backend_ssh_port }}"
    relay_port: 12222
    public_port: 2222
frp_admin_user: frp-doctor
frp_client_admin_port: 17400
frp_server_admin_port: 17401
frp_backend_ssh_port: 2222
frp_relay_ssh_port: 22
