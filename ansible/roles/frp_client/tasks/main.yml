---
- name: Install the relay private key
  ansible.builtin.copy:
    content: "{{ frp_relay_private_key | trim }}\n"
    dest: /etc/rbridge/relay.key
    owner: "{{ frp_service_user }}"
    group: "{{ frp_service_user }}"
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart FRP transport

- name: Install verified relay host keys
  ansible.builtin.copy:
    content: "{{ frp_relay_known_hosts | trim }}\n"
    dest: /etc/rbridge/known_hosts
    owner: root
    group: "{{ frp_service_user }}"
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart FRP transport

- name: Install the public key for the dedicated tunneled SSH service
  ansible.builtin.copy:
    content: "{{ frp_login_public_key | trim }}\n"
    dest: /etc/rbridge/login_authorized_keys
    owner: root
    group: root
    mode: "0644"
  no_log: true
  diff: false
  when: frp_managed_ssh

- name: Create the OpenSSH privilege separation runtime directory
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: frp_managed_ssh

- name: Install the isolated key-only SSH configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/rbridge/sshd_config
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  no_log: true
  diff: false
  notify: Restart tunneled SSH
  when: frp_managed_ssh

- name: Install the FRP client configuration
  ansible.builtin.template:
    src: frpc.toml.j2
    dest: /etc/rbridge/frpc.toml
    owner: root
    group: "{{ frp_service_user }}"
    mode: "0640"
    validate: "{{ frp_binary_dir }}/frpc verify -c %s"
  notify: Restart FRP client
  no_log: true
  diff: false

- name: Install client services
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ['rbridge-transport.service', 'rbridge-client.service'] + (['rbridge-sshd.service'] if frp_managed_ssh else []) }}"
  no_log: true
  diff: false
  notify:
    - Restart tunneled SSH
    - Restart FRP transport
    - Restart FRP client

- name: Inspect the previously managed SSH unit
  ansible.builtin.stat:
    path: /etc/systemd/system/rbridge-sshd.service
  register: frp_old_sshd_unit
  when: not frp_managed_ssh

- name: Stop the disabled managed SSH listener
  ansible.builtin.systemd_service:
    name: rbridge-sshd.service
    state: stopped
    enabled: false
  when:
    - not frp_managed_ssh
    - frp_old_sshd_unit.stat.exists

# v0.1's dedicated unit owned /run/sshd as a RuntimeDirectory. Restore it
# after stopping that unit so native host SSH remains usable during upgrade.
- name: Preserve native OpenSSH runtime after removing the old managed instance
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not frp_managed_ssh

- name: Remove obsolete managed SSH configuration and unit
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/rbridge-sshd.service
    - /etc/rbridge/sshd_config
    - /etc/rbridge/login_authorized_keys
  when: not frp_managed_ssh
  register: frp_removed_sshd

- name: Reload systemd after removing managed SSH
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: frp_removed_sshd is changed

- name: Install the WSL keepalive helper
  ansible.builtin.template:
    src: rbridge-keepalive.j2
    dest: /usr/local/sbin/rbridge-keepalive
    owner: root
    group: root
    mode: "0755"

- name: Apply pending client changes
  ansible.builtin.meta: flush_handlers

- name: Enable client services at boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ (['rbridge-sshd'] if frp_managed_ssh else []) + ['rbridge-transport', 'rbridge-client'] }}"
